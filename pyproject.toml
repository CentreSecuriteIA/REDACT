[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "redact"
version = "0.1.0"
authors = [
    { name = "Leonhard Waibl", email = "leonhardwaibl@gmail.com" },
]
description = "Red-team Dataset Automation & Construction Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "pyfiglet>=0.8",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
vllm = ["vllm>=0.4", "hf_transfer>=0.1"]
hf = ["datasets>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0", "ipykernel>=7.0"]

[project.urls]
Homepage = "https://github.com/leonhamnett/REDACT"
Issues = "https://github.com/leonhamnett/REDACT/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/redact"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
