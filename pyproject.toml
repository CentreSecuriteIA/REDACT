[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "redact"
version = "0.1.0"
authors = [
    { name = "Leonhard Waibl", email = "leonhardwaibl@gmail.com" },
]
description = "Red-team Dataset Automation & Construction Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "pyfiglet>=0.8",
    "filelock>=3.11",
]

[project.optional-dependencies]
# psutil: vLLM installs it, and redact imports it directly to end engine
# processes and their workers (backends/vllm.py) and to tell this run's
# engine processes from others on a card (driver.py, only with local models).
# A machine-translation model runs only on vLLM, and the paraphrase check's
# language gate runs beside a local paraphraser, so the extra brings langid.
vllm = ["vllm>=0.4", "hf_transfer>=0.1", "psutil>=5.9", "redact[langid]"]
# GlotLID, which checks the language of a machine translation and of a
# paraphrase (jailbreak/obfuscation/langid.py): fastText inference only, no numpy.
langid = ["fasttext-predict>=0.9.2.4", "huggingface_hub>=0.20"]
# accelerate is required, not optional: IntrospectConfig.device_map defaults
# to "auto", and transformers raises without accelerate whenever device_map
# is set — so every introspection backend construction needs it.
transformers = ["torch>=2.0", "transformers>=4.40", "accelerate>=0.26"]
hf = ["datasets>=2.0"]
# pyyaml: the neutral containers' test parses the YAML they write.
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0", "ipykernel>=7.0", "pyyaml>=6.0"]
# The documentation site (mkdocs.yml): `mkdocs build --strict`. ruff formats
# the API reference's signatures.
docs = ["mkdocs-material", "mkdocstrings[python]", "ruff"]

[project.urls]
Homepage = "https://github.com/CentreSecuriteIA/REDACT"
Documentation = "https://centresecuriteia.github.io/REDACT/"
Issues = "https://github.com/CentreSecuriteIA/REDACT/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/redact"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# SIM (flake8-simplify) and PLR2004 (magic-value-comparison) are enabled and
# clean as of this writing. The rest of the "PLR" (pylint-refactor) group and
# C901 (mccabe complexity) were evaluated and deliberately left off:
#   - PLR0913 (too-many-arguments): 57 findings. Conflicts with this project's
#     own API design — public pipeline functions (e.g. generate_jailbreaks,
#     generate_paraphrases) intentionally take many explicit keyword params
#     rather than a config object; see CLAUDE.md. Not a code smell here.
#   - C901 / PLR0912 / PLR0915 (complexity / branches / statements): ~35
#     findings, mostly the batch/plan/execute orchestration functions
#     (run_from_constitution, generate_jailbreaks, build_dataset, etc.).
#     Real complexity worth reducing over time via targeted extraction, but
#     fixing all of them is a much larger, higher-risk initiative than a
#     lint-rule toggle — tracked separately (see cleanup.md), not enforced
#     as a blanket rule yet.
select = ["E", "F", "I", "UP", "SIM", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export names for the public API (e.g. `from redact
# import generate_jailbreaks`); ruff can't distinguish that from a genuinely
# unused import without an `__all__` list everywhere, which this project
# doesn't use. Not dead code — verified case by case for every other file
# (see cleanup.md) before deciding this pattern was safe to blanket-ignore
# only here.
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
